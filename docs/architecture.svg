<rect x="18" y="71" width="305" height="54" rx="9" class="card"/><text x="170" y="93" text-anchor="middle" class="boxTitle">Bronze · source tables</text><text x="170" y="113" text-anchor="middle" class="boxSub">test_customers · test_orders</text>
