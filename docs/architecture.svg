<g transform="translate(801 406)"><rect width="341" height="270" rx="14" fill="#fff6e8" stroke="#e7c991"/><text x="18" y="31" class="section">PROD</text><text x="18" y="52" class="boxSub">retailflow_prod</text>
<rect x="18" y="71" width="305" height="54" rx="9" class="card"/><text x="170" y="93" text-anchor="middle" class="boxTitle">Bronze · source tables</text><text x="170" y="113" text-anchor="middle" class="boxSub">prod_customers · prod_orders</text>
<path d="M170 125 V148" class="flow"/><rect x="18" y="150" width="305" height="54" rx="9" class="card"/><text x="170" y="172" text-anchor="middle" class="boxTitle">Silver · cleaned</text><text x="170" y="192" text-anchor="middle" class="boxSub">customers_clean · orders_clean</text>
<path d="M170 204 V225" class="flow"/><rect x="18" y="226" width="305" height="34" rx="9" fill="#d6f5e7" stroke="#a7d8bf"/><text x="170" y="249" text-anchor="middle" class="boxTitle">Gold · customer_sales_summary</text></g>
<text x="48" y="747" class="subtitle">Bronze tables are pre-existing · Bundle deploy does not seed data · DEV / TEST / PROD share one workspace</text>
