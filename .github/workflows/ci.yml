name: RetailFlow CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "feature/**"
      - "ci/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML and Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate bundle and workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path(".github/workflows").glob("*.yml"))
          paths += sorted(Path("retailflow-bundle").rglob("*.yml"))
          paths += sorted(Path("retailflow-bundle").rglob("*.yaml"))
          assert paths, "No YAML files found"

          for path in paths:
              with path.open(encoding="utf-8") as stream:
                  document = yaml.safe_load(stream)
              assert isinstance(document, dict), f"{path}: expected YAML mapping"
              print(f"YAML parsed: {path}")

          with Path("retailflow-bundle/databricks.yml").open(encoding="utf-8") as stream:
              bundle = yaml.safe_load(stream)
          targets = bundle.get("targets", {})
          for target in ("dev", "test", "prod"):
              assert target in targets, f"Missing bundle target: {target}"
              config = targets[target]
              assert isinstance(config, dict), f"{target}: target must be a mapping"
              assert config.get("mode") in ("development", "production"), (
                  f"{target}: mode must be configured within its target"
              )
              assert isinstance(config.get("workspace"), dict), (
                  f"{target}: workspace must be configured within its target"
              )
          print("Bundle target structure verified")
          PY

      - name: Check Python syntax
        run: python -m compileall -q retailflow-bundle/src
